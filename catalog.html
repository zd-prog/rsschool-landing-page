<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House</title>
    <link rel="icon" type="image/png" href="images/coffee-cup.png">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-menu">
                <a href="index.html">
                    <img class="logo" src="images/logo.png" alt="Logo" width="100" height="60">
                    <img class="logo-dark" src="images/logo-dark.png" alt="Logo" width="100" height="60">
                </a>
                <nav>
                    <ul>
                        <li><a href="#favorite">Favorite coffee</a></li>
                        <li><a href="#about">About</a></li>
                        <li><a href="#mobile">Mobile app</a></li>
                        <li><a href="#contact">Contact us</a></li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <div class="theme-switch">
                        <div class="toggle current">
                            <img src="images/Sun.png" alt="Light" width="22" height="22">
                        </div>
                        <div class="toggle">
                            <img class="moon" src="images/Moon.png" alt="Dark" width="22" height="22">
                            <img class="moon-dark" src="images/Moon-dark.png" alt="Dark" width="22" height="22">
                        </div>
                    </div>
                    <div class="coffee-menu">
                        <ul>
                            <li>
                                <a href="catalog.html">
                                    Menu
                                    <img class="coffee-cup" src="images/coffee-cup.png" alt="Coffee Cup" width="20"
                                        height="20">
                                    <img class="coffee-cup-dark" src="images/coffee-cup-dark.png" alt="Coffee Cup"
                                        width="20" height="20">
                                </a>
                            </li>
                        </ul>
                        <div class="burger-menu-button">
                            <img class="burger-menu" src="images/burger-menu.png" alt="Burger Menu">
                            <img class="burger-menu-active" src="images/burger-menu-active.png" alt="Burger Menu">
                            <img class="burger-menu-dark" src="images/burger-menu-dark.png" alt="Burger Menu">
                            <img class="burger-menu-dark-active" src="images/burger-menu-dark-active.png"
                                alt="Burger Menu">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="menu">
            <div class="container">
                <div class="offer">
                    <h2>Behind each of our cups hides an <span class="accent">amazing surprise</span></h2>
                    <div class="tabs">
                        <div class="tab current">
                            <div class="icon">☕</div>Coffee
                        </div>
                        <div class="tab">
                            <div class="icon">🫖</div>Tea
                        </div>
                        <div class="tab">
                            <div class="icon">🍰</div>Dessert
                        </div>
                    </div>
                </div>
                <div class="slider">
                    <div class="slider-row">
                        <div class="slide">
                            <div class="grid" id="coffee"></div>
                        </div>
                        <div class="slide">
                            <div class="grid" id="tea"></div>
                        </div>
                        <div class="slide">
                            <div class="grid" id="dessert"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <div class="container" id="contact">
            <div class="offer">
                <h2>Sip, Savor, Smile. <span class="accent">It’s coffee time!</span></h2>
                <div class="socials">
                    <a href="https://twitter.com" target="_blank">
                        <img src="images/twitter.png" alt="Twitter" width="24" height="24">
                    </a>
                    <a href="https://instagram.com" target="_blank">
                        <img src="images/instagram.png" alt="Instagram" width="24" height="24">
                    </a>
                    <a href="https://facebook.com" target="_blank">
                        <img src="images/facebook.png" alt="Facebook" width="24" height="24">
                    </a>
                </div>
            </div>
            <div class="contact-info">
                <h3>Contact us</h3>
                <div class="contacts">
                    <ul>
                        <li>
                            <a href="https://www.google.com/maps/search/8558+Green+Rd.,+LA/@48.5033317,-122.3348632,15z?entry=s&sa=X&ved=1t%3A199789"
                                target="_blank">
                                <img src="images/pin-alt.png" alt="Pin" width="20" height="20">
                                8558 Green Rd., LA
                            </a>
                        </li>
                        <li>
                            <a href="tel:+1(603)555-0123" target="_blank">
                                <img src="images/phone.png" alt="Phone" width="20" height="20">
                                +1(603) 555-0123
                            </a>
                        </li>
                        <li>
                            <a>
                                <img src="images/clock.png" alt="Clock" width="20" height="20">
                                Mon–Sat: 9:00–23:00
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <div class="modal" id="modal"></div>
    <script src="scripts/index.js"></script>
</body>

</html>
